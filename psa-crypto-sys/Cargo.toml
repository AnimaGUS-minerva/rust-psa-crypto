[package]
name = "psa-crypto-sys"
version = "0.12.0"
authors = ["Parsec Project Contributors"]
edition = "2018"
description = "Wrapper around the PSA Cryptography API"
readme = "README.md"
keywords = ["psa", "crypto", "cryptography"]
categories = ["api-bindings", "external-ffi-bindings", "cryptography"]
license = "Apache-2.0"
repository = "https://github.com/parallaxsecond/rust-psa-crypto"
rust-version = "1.66.0"
links = "mbedcrypto"

[build-dependencies]
mbedtls_bindings = { path = "mbedtls_bindings", optional = true }
bindgen = { version = "0.69.4", optional = true }
cc = "1.0.59"
cmake = "0.1.44"
regex = "1.9.1"
walkdir = "2.3.1"
pkg-config = "0.3.29"

[dependencies]
cfg-if = { version = "1.0.0", optional = true }
libc = { version = "0.2.0", optional = true }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2.0" }

[features]
default = ["operations"]
static = []
interface = ["bindgen"]
operations = ["interface"]
prefix = []
mbedtls-std =   ["mbedtls_bindings/mbedtls-std", "cfg-if"]
mbedtls-nostd = ["mbedtls_bindings/mbedtls-nostd", "cfg-if"]
mbedtls-fs-workaround = []
mbedtls-time-workaround = []
